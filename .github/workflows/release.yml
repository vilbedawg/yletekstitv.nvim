name: Release

# Conventional commits on main (feat:, fix:, feat!:) keep a release PR up to date.
# Merging that PR tags the version and publishes a GitHub release with the changelog.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
